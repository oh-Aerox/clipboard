<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self';"
    />
    <title>剪贴板</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="bar">
      <div class="search">
        <svg class="search__icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="6.75" cy="6.75" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M10.2 10.2 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        <input
          id="search"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="搜索剪贴板内容…"
          aria-label="搜索剪贴板内容"
        />
        <button id="search-clear" class="search__clear" type="button" title="清空搜索" hidden>×</button>
      </div>

      <div class="bar__meta">
        <span id="count" class="count"></span>
      </div>

      <div class="bar__actions">
        <label class="switch" title="选中后自动粘贴到唤出面板前的那个窗口">
          <input id="auto-paste" type="checkbox" />
          <span>自动粘贴</span>
        </label>
        <button id="btn-clear" class="btn" type="button" title="清空历史（保留置顶）">清空</button>
        <button id="btn-settings" class="btn" type="button" title="设置 (Ctrl+,)">设置</button>
        <button id="btn-close" class="btn btn--icon" type="button" title="隐藏面板 (Esc)">×</button>
      </div>
    </header>

    <main id="strip" class="strip" tabindex="-1">
      <div id="empty" class="empty">
        <p class="empty__title">还没有剪贴板记录</p>
        <p class="empty__hint">复制任意文字或图片，就会出现在这里</p>
      </div>
    </main>

    <footer class="hints">
      <span><kbd>←</kbd><kbd>→</kbd> 选择</span>
      <span><kbd>Enter</kbd> 粘贴</span>
      <span><kbd>Ctrl</kbd>+<kbd>Enter</kbd> 仅复制</span>
      <span><kbd>Alt</kbd>+<kbd>1…9</kbd> 快速取用</span>
      <span><kbd>Ctrl</kbd>+<kbd>P</kbd> 置顶</span>
      <span><kbd>Delete</kbd> 删除</span>
      <span><kbd>Esc</kbd> 隐藏</span>
    </footer>

    <script src="panel.js"></script>
  </body>
</html>
